name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every backend, even if one fails.
      fail-fast: false
      matrix:
        backend: [cpp, csharp, java, js, lua, py, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Temper's nightly build of main, with its own JRE. The asset name
      # includes the version, so match by pattern.
      - name: Get Temper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dev -R temperlang/temper -p '*-linux-x64.tgz' -O - | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP"/temper-*-linux-x64 >> "$GITHUB_PATH"

      # Toolchains per backend. Runners already have g++, cargo and Maven.
      - if: matrix.backend == 'py'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: matrix.backend == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: matrix.backend == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.backend == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.backend == 'lua'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4
          command -v lua || sudo ln -s /usr/bin/lua5.4 /usr/local/bin/lua
          lua -v

      - if: matrix.backend == 'py'
        uses: astral-sh/setup-uv@v6

      - name: Test
        run: temper test -b ${{ matrix.backend }}

      # The example and the tour in demos/, which the site shows, must
      # print the same text in every language. Each language's own tools
      # build them against the output `temper test` left in temper.out/.
      # The tour's Temper is a test, which `temper test` ran above.
      - name: Example and tour
        run: python3 demos/run.py ${{ matrix.backend }}

      # Round trips through embedded engines, with the Python library:
      # SQLite through the standard library's sqlite3, and DuckDB
      # through the duckdb package in uv.lock.
      - if: matrix.backend == 'py'
        name: Build the Python library
        id: build-py
        run: temper build -b py
      - if: matrix.backend == 'py'
        name: SQLite round trips
        run: python tests/engines/sqlite_roundtrip.py
      # Even if SQLite's fail.
      - if: ${{ !cancelled() && matrix.backend == 'py' && steps.build-py.outcome == 'success' }}
        name: DuckDB round trips
        env:
          UV_PYTHON: "3.11"
        run: uv run --locked tests/engines/duckdb_roundtrip.py

  # Round trips through PostgreSQL, MariaDB, and MySQL, as service
  # containers, with the Python library and the drivers in uv.lock
  # (psycopg 3 and PyMySQL). The throwaway passwords are only for these
  # containers.
  engines:
    name: round trips (PostgreSQL, MariaDB, MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: wherewith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: wherewith
          MARIADB_DATABASE: wherewith
        ports:
          - 3306:3306
        # Data in memory, since the name checks make many tables.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/mysql
      # MySQL's current LTS, on 3307 beside MariaDB. Its image sets up
      # with networking off, so a ping over TCP answers only once the
      # real server is up.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wherewith
          MYSQL_DATABASE: wherewith
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/mysql
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get Temper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dev -R temperlang/temper -p '*-linux-x64.tgz' -O - | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP"/temper-*-linux-x64 >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6

      - name: Build the Python library and drivers
        id: build
        run: |
          temper build -b py
          uv sync --locked

      - name: PostgreSQL round trips
        run: uv run --locked tests/engines/postgres_roundtrip.py --require-server

      # Even if PostgreSQL's fail.
      - name: MariaDB round trips
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --locked tests/engines/mariadb_roundtrip.py --require-server

      # The MariaDB runner, with MySQL's expectations. Even if the
      # others fail.
      - name: MySQL round trips
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --locked tests/engines/mariadb_roundtrip.py --engine mysql --require-server
