name: test

# Wherewith's Temper tests on every backend, the example and tour in
# each language (demos/), and round trips through real databases, with
# Temper's new compiler (tempest, written in Rust). Also builds the
# project site (site/), and publishes it to GitHub Pages from main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Until the new compiler's switch lands, its nightly build (from
  # temperlang/tempest's main) lags the fixes Wherewith relies on, so CI
  # builds it from a pinned commit of its transition branch,
  # rfc-657-transition. Once the switch lands, download Temper's
  # nightly from temperlang/temper's releases instead, and drop the
  # `temper` job's build.
  TEMPEST_COMMIT: 5f3cf49801fcd5f125ea2175cc5cb993b630419b
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # The compiler, as an artifact for the other jobs.
  temper:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit, with the release in a comment.
      # The binary, cached by commit, so it's built once per pin.
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/temper-bin
          key: tempest-${{ runner.os }}-${{ env.TEMPEST_COMMIT }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: temperlang/tempest
          ref: ${{ env.TEMPEST_COMMIT }}
          path: tempest
          persist-credentials: false
          # The whole history and its tags, from which the compiler names
          # its version, as its releases are built.
          fetch-depth: 0
      # Tempest's minimum Rust, which its own CI builds with.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the compiler
        working-directory: tempest
        run: |
          cargo build --locked --release -p tempest
          mkdir -p "$RUNNER_TEMP/temper-bin"
          cp target/release/temper "$RUNNER_TEMP/temper-bin/"
      # Checkouts must be inside the workspace, but Temper builds every
      # Temper file under it, so the compiler's sources must go.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf tempest
      - run: '"$RUNNER_TEMP/temper-bin/temper" --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temper
          path: ${{ runner.temp }}/temper-bin/temper
          retention-days: 3

  test:
    name: test (${{ matrix.backend }})
    needs: temper
    # Pinned for Ubuntu's lua5.4, which is 5.4.6 on noble.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Report every backend, even if one fails.
      fail-fast: false
      matrix:
        backend: [interp, cpp, csharp, java, js, lua, py, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: temper
          path: ${{ runner.temp }}/temper-bin
      - name: Get Temper
        run: |
          chmod +x "$RUNNER_TEMP/temper-bin/temper"
          echo "$RUNNER_TEMP/temper-bin" >> "$GITHUB_PATH"

      # Toolchains per backend, as Temper's own CI sets them up. Runners
      # already have g++, CMake, cargo, and Maven.
      - if: matrix.backend == 'py'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - if: matrix.backend == 'py'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: matrix.backend == 'js'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      # Mocha runs the JS tests.
      - if: matrix.backend == 'js'
        run: npm install --global mocha@11.8.0
      # JUnit, which the Java tests read from Maven's cache.
      - if: matrix.backend == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.backend == 'java'
        run: |
          mvn -q dependency:get -Dartifact=org.junit.jupiter:junit-jupiter-engine:5.9.2
          mvn -q dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.9.2
      # Generated C# targets .NET 6, as Kotlin's projects do.
      - if: matrix.backend == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "6.0.x"
      # Lua 5.4.6, from Ubuntu's archive, as `lua`.
      - if: matrix.backend == 'lua'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          lua -v
      # libcurl's headers, for std's net in generated C++.
      - if: matrix.backend == 'cpp'
        run: |
          dpkg -s libcurl4-openssl-dev >/dev/null 2>&1 ||
            { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcurl4-openssl-dev; }

      # Rust's tests build offline, so the crates generated code needs go
      # in cargo's cache first.
      - if: matrix.backend == 'rust'
        run: |
          temper build -b rust
          cargo fetch --manifest-path temper.out/rust/wherewith/Cargo.toml

      - name: Test
        run: temper test -b ${{ matrix.backend }}

      # The example and the tour in demos/, which the site shows, must
      # print the same text in every language. Each language's own tools
      # build them against the output `temper test` left in temper.out/.
      # The tour's Temper is a test, which `temper test` ran above.
      - if: matrix.backend != 'interp'
        name: Example and tour
        run: python3 demos/run.py ${{ matrix.backend }}

      # Round trips through embedded engines, with the Python library:
      # SQLite through the standard library's sqlite3, and DuckDB
      # through the duckdb package in uv.lock.
      - if: matrix.backend == 'py'
        name: Build the Python library
        id: build-py
        run: temper build -b py
      - if: matrix.backend == 'py'
        name: SQLite round trips
        run: python tests/engines/sqlite_roundtrip.py
      # Even if SQLite's fail.
      - if: ${{ !cancelled() && matrix.backend == 'py' && steps.build-py.outcome == 'success' }}
        name: DuckDB round trips
        env:
          UV_PYTHON: "3.11"
        run: uv run --locked tests/engines/duckdb_roundtrip.py

  # Round trips through PostgreSQL, MariaDB, and MySQL, as service
  # containers, with the Python library and the drivers in uv.lock
  # (psycopg 3 and PyMySQL). The throwaway passwords are only for these
  # containers.
  engines:
    name: round trips (PostgreSQL, MariaDB, MySQL)
    needs: temper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: wherewith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: wherewith
          MARIADB_DATABASE: wherewith
        ports:
          - 3306:3306
        # Data in memory, since the name checks make many tables.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/mysql
      # MySQL's current LTS, on 3307 beside MariaDB. Its image sets up
      # with networking off, so a ping over TCP answers only once the
      # real server is up.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wherewith
          MYSQL_DATABASE: wherewith
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/mysql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: temper
          path: ${{ runner.temp }}/temper-bin
      - name: Get Temper
        run: |
          chmod +x "$RUNNER_TEMP/temper-bin/temper"
          echo "$RUNNER_TEMP/temper-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the Python library and drivers
        id: build
        run: |
          temper build -b py
          uv sync --locked

      - name: PostgreSQL round trips
        run: uv run --locked tests/engines/postgres_roundtrip.py --require-server

      # Even if PostgreSQL's fail.
      - name: MariaDB round trips
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --locked tests/engines/mariadb_roundtrip.py --require-server

      # The MariaDB runner, with MySQL's expectations. Even if the
      # others fail.
      - name: MySQL round trips
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --locked tests/engines/mariadb_roundtrip.py --engine mysql --require-server

  # The project site, built with the same compiler, and published to
  # GitHub Pages from main. The page's code comes from the sources,
  # which the jobs above run.
  site:
    needs: temper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: temper
          path: ${{ runner.temp }}/temper-bin
      - name: Get Temper
        run: |
          chmod +x "$RUNNER_TEMP/temper-bin/temper"
          echo "$RUNNER_TEMP/temper-bin" >> "$GITHUB_PATH"

      # Node type-checks the page's script, and runs the JS tour as the
      # page does.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the site
        run: |
          npm ci --prefix site
          temper build -b js
          uv run site/build.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  # Publishes only from main. Needs Settings > Pages > Source: GitHub
  # Actions.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
